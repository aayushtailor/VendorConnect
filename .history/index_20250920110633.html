<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jaipur Jewells — Local Vendors Directory</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <link rel="stylesheet" href="static/css/styles.css">
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-500 to-yellow-400 flex items-center justify-center text-white font-bold">JJ</div>
        <div>
          <h1 class="text-xl font-semibold">Jaipur Jewells</h1>
          <p class="text-xs text-gray-500">Discover local vendors in Jaipur</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="admin.html" class="text-sm px-3 py-2 bg-indigo-600 text-white rounded-lg shadow">Admin</a>
        <button id="openRegister" class="text-sm px-3 py-2 bg-green-500 text-white rounded-lg shadow">Register</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Search & filters -->
    <section class="mb-6">
      <div class="bg-white p-4 rounded-lg shadow flex flex-col md:flex-row gap-3 md:items-center">
        <input id="searchInput" placeholder="Search by business name, category or city" class="flex-1 px-4 py-3 rounded border" />
        <select id="categoryFilter" class="px-3 py-2 rounded border">
          <option value="">All Categories</option>
          <option>Jewellery</option>
          <option>Tailor</option>
          <option>Photographer</option>
        </select>
        <button id="searchBtn" class="px-4 py-2 bg-indigo-600 text-white rounded">Search</button>
      </div>
    </section>

    <!-- Vendors grid -->
    <section id="vendorsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></section>

    <!-- No results -->
    <p id="noResults" class="text-center text-gray-500 mt-8 hidden">No vendors found.</p>
  </main>

  <!-- Vendor registration modal -->
  <div id="registerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-lg w-full max-w-2xl p-6 shadow-lg overflow-auto max-h-[90vh]">
      <h3 class="text-lg font-semibold mb-3">Register your business</h3>
      <form id="registerForm">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input name="name" placeholder="Contact Name" class="p-2 border rounded" required />
          <input name="business_name" placeholder="Business Name" class="p-2 border rounded" required />
          <input name="category" placeholder="Category (e.g. Jewellery)" class="p-2 border rounded" required />
          <input name="city" placeholder="City" class="p-2 border rounded" required />
          <input name="phone" placeholder="Phone" class="p-2 border rounded" />
          <input name="whatsapp" placeholder="WhatsApp" class="p-2 border rounded" />
          <input name="email" placeholder="Email" class="p-2 border rounded" />
          <input name="website" placeholder="Website" class="p-2 border rounded" />
          <textarea name="description" placeholder="Short description" class="p-2 border rounded md:col-span-2"></textarea>
        </div>
        <div class="mt-4 flex gap-2 justify-end">
          <button type="button" id="closeRegister" class="px-4 py-2 border rounded">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="static/js/app.js"></script>
  <script> AOS.init({ duration: 700, once: true });</script>
</body>
</html>
