<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendor Profile — Jaipur Jewells</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</head>
<body class="bg-gradient-to-br from-indigo-700 via-purple-700 to-blue-600 text-white">

  <!-- Hero -->
  <header class="text-center py-12 px-4">
    <h1 class="text-4xl font-extrabold mb-2">Vendor Profile</h1>
    <p class="text-sm text-gray-200">Discover details about this vendor</p>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <a href="index.html" class="inline-block mb-6 text-pink-400 hover:text-pink-300">&larr; Back to directory</a>
    <div id="profileContainer" class="bg-white/10 backdrop-blur-lg shadow-lg rounded-2xl p-6"></div>
  </main>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const vendorId = parseInt(params.get("id") || "0");

    function loadVendor(){
      const v = dummyVendors.find(x => x.id === vendorId);
      if(!v){
        document.getElementById('profileContainer').innerHTML = "<p>Vendor not found</p>";
        return;
      }
      document.getElementById('profileContainer').innerHTML = `
        <div class="flex flex-col md:flex-row gap-6 items-start">
          <div class="w-32 h-32 rounded-xl bg-white/20 overflow-hidden">
            <img src="placeholder.jpg" alt="logo" class="w-full h-full object-cover">
          </div>
          <div>
            <h2 class="text-2xl font-bold">${v.business_name || v.name}</h2>
            <p class="text-sm text-gray-200">${v.category} • ${v.city}</p>
            <p class="mt-3 text-gray-100">${v.description || ''}</p>
            <div class="mt-4 flex gap-3">
              ${v.phone?`<a href="tel:${v.phone}" class="px-4 py-2 bg-pink-500 rounded-full hover:bg-pink-600 transition">Call</a>`:''}
              ${v.whatsapp?`<a href="https://wa.me/${v.whatsapp}" target="_blank" class="px-4 py-2 bg-green-500 rounded-full hover:bg-green-600 transition">WhatsApp</a>`:''}
            </div>
          </div>
        </div>
        <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
          <img src="placeholder.jpg" class="w-full h-48 object-cover rounded-xl"/>
          <img src="placeholder.jpg" class="w-full h-48 object-cover rounded-xl"/>
        </div>
      `;
    }

    loadVendor();
  </script>
  <script>
  AOS.init({
    duration: 800,
    once: true,
    easing: 'ease-in-out'
  });
</script>

</body>
</html>
