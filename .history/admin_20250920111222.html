<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — Jaipur Jewells</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100">

  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">Admin Dashboard</h1>
    <div id="vendorsList" class="grid grid-cols-1 gap-4"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // temporary state for approvals (frontend only)
    let approvedIds = [];

    function renderAdmin(){
      const container = document.getElementById('vendorsList');
      container.innerHTML = dummyVendors.map(v => `
        <div class="bg-white p-4 rounded shadow flex justify-between items-center">
          <div>
            <div class="font-semibold">
              ${v.business_name || v.name} 
              <span class="text-xs text-gray-500">(${v.city})</span>
            </div>
            <div class="text-sm text-gray-600">${v.category}</div>
          </div>
          <div class="flex gap-2">
            ${approvedIds.includes(v.id) 
              ? '<span class="text-green-600 font-semibold">Approved</span>' 
              : `<button onclick="approve(${v.id})" class="px-3 py-2 bg-indigo-600 text-white rounded">Approve</button>`}
            <button onclick="del(${v.id})" class="px-3 py-2 bg-red-600 text-white rounded">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function approve(id){
      if(!approvedIds.includes(id)) approvedIds.push(id);
      renderAdmin();
    }

    function del(id){
      alert("Deleted vendor ID: " + id + " (frontend only, backend coming soon).");
    }

    // initial render
    renderAdmin();
  </script>
</body>
</html>
