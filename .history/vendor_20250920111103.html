<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendor Profile — Jaipur Jewells</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50">

  <div class="max-w-4xl mx-auto py-8 px-4">
    <a href="index.html" class="text-sm text-indigo-600">&larr; Back to directory</a>
    <div id="profileContainer" class="bg-white shadow rounded p-6 mt-4"></div>
  </div>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const vendorId = parseInt(params.get("id") || "0");

    function loadVendor(){
      const v = dummyVendors.find(x => x.id === vendorId);
      if(!v){
        document.getElementById('profileContainer').innerHTML = "<p>Vendor not found</p>";
        return;
      }
      document.getElementById('profileContainer').innerHTML = `
        <div class="flex gap-4 items-start">
          <div class="w-32 h-32 rounded-lg bg-gray-100 overflow-hidden">
            <img src="placeholder.jpg" alt="logo" class="w-full h-full object-cover">
          </div>
          <div>
            <h2 class="text-2xl font-bold">${v.business_name || v.name}</h2>
            <p class="text-sm text-gray-500">${v.category} • ${v.city}</p>
            <p class="mt-2">${v.description || ''}</p>
            <div class="mt-4 flex gap-2">
              ${v.phone?`<a href="tel:${v.phone}" class="px-3 py-2 bg-indigo-600 text-white rounded">Call</a>`:''}
              ${v.whatsapp?`<a href="https://wa.me/${v.whatsapp}" target="_blank" class="px-3 py-2 bg-green-600 text-white rounded">WhatsApp</a>`:''}
            </div>
          </div>
        </div>
        <div class="mt-6 grid grid-cols-2 gap-3">
          <img src="placeholder.jpg" class="w-full h-44 object-cover rounded"/>
          <img src="placeholder.jpg" class="w-full h-44 object-cover rounded"/>
        </div>
      `;
    }

    loadVendor();
  </script>
</body>
</html>
