<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendor Dashboard — Jaipur Jewells</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</head>
<body class="min-h-screen bg-gradient-to-br from-purple-600 via-indigo-600 to-blue-500 text-white">

 <!-- Navbar -->
<nav class="fixed top-0 left-0 w-full z-50 bg-white/10 backdrop-blur-md shadow-md">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <!-- Logo -->
    <div class="flex items-center gap-2">
      <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-full">
      <span class="font-bold text-lg text-white">Jaipur Jewells</span>
    </div>

    <!-- Desktop Links -->
    <div class="hidden md:flex items-center gap-6 text-white font-medium">
      <a href="index.html" class="hover:text-pink-300">Home</a>
      <a href="index.html#vendorsGrid" class="hover:text-pink-300">Vendors</a>
      <a href="about.html" class="hover:text-pink-300">About</a>
      <a href="contact.html" class="hover:text-pink-300">Contact</a>
      <a href="blog.html" class="hover:text-pink-300">Blog</a>
    </div>

    <!-- CTA -->
    <div class="flex items-center gap-3">
      <a href="login.html" class="hidden md:block px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Login</a>
      <a href="register.html" class="hidden md:block px-4 py-2 bg-pink-500 text-white rounded-lg hover:bg-pink-600">Register</a>
      <!-- Hamburger for Mobile -->
      <button id="menuBtn" class="md:hidden flex flex-col gap-1">
        <span class="w-6 h-0.5 bg-white"></span>
        <span class="w-6 h-0.5 bg-white"></span>
        <span class="w-6 h-0.5 bg-white"></span>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Menu -->
<div id="mobileMenu" class="fixed inset-0 bg-black/70 backdrop-blur-md z-40 hidden">
  <div class="absolute top-0 right-0 w-64 h-full bg-white/90 text-gray-900 shadow-lg p-6 flex flex-col">
    <button id="closeMenu" class="self-end mb-6 text-2xl font-bold text-gray-700">&times;</button>
    <a href="index.html" class="mb-4 text-lg font-semibold hover:text-pink-500">Home</a>
    <a href="index.html#vendorsGrid" class="mb-4 text-lg font-semibold hover:text-pink-500">Vendors</a>
    <a href="about.html" class="mb-4 text-lg font-semibold hover:text-pink-500">About</a>
    <a href="contact.html" class="mb-4 text-lg font-semibold hover:text-pink-500">Contact</a>
    <a href="blog.html" class="mb-6 text-lg font-semibold hover:text-pink-500">Blog</a>
    <a href="login.html" class="mb-3 px-4 py-2 bg-indigo-600 text-white rounded-lg text-center hover:bg-indigo-700">Login</a>
    <a href="register.html" class="px-4 py-2 bg-pink-500 text-white rounded-lg text-center hover:bg-pink-600">Register</a>
  </div>
</div>


  <!-- Dashboard -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">Vendor Dashboard</h1>

    <!-- Profile Form -->
    <form class="space-y-4 bg-white/20 backdrop-blur-lg p-6 rounded-2xl shadow-lg">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" placeholder="Business Name" class="p-3 rounded-lg bg-white/30 text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <input type="text" placeholder="Category" class="p-3 rounded-lg bg-white/30 text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <input type="text" placeholder="City" class="p-3 rounded-lg bg-white/30 text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <input type="text" placeholder="Phone" class="p-3 rounded-lg bg-white/30 text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <input type="text" placeholder="WhatsApp" class="p-3 rounded-lg bg-white/30 text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <input type="text" placeholder="Website" class="p-3 rounded-lg bg-white/30 text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>
      <textarea placeholder="Business Description" class="w-full p-3 rounded-lg bg-white/30 text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400"></textarea>
      <input type="file" class="w-full p-2 rounded-lg bg-white/30 text-white focus:outline-none">
      <button type="submit" class="w-full py-3 bg-pink-500 hover:bg-pink-600 rounded-lg font-semibold">Update Profile</button>
    </form>
  </main>

</body>
</html>
