<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login — Jaipur Jewells</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-purple-800 to-indigo-800">

  <div class="bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-lg w-full max-w-md text-white">
    <h1 class="text-3xl font-bold mb-6 text-center">Admin Login</h1>
    <form class="space-y-4">
      <input type="email" placeholder="Admin Email" class="w-full px-4 py-3 rounded-lg bg-white/30 placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
      <input type="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg bg-white/30 placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
      
      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold">Login</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-300">
      This page is restricted for administrators only.
    </p>
  </div>

</body>
</html>
