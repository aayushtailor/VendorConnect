<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Jaipur Jewells</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-600 via-indigo-600 to-blue-500">

  <div class="bg-white/20 backdrop-blur-lg p-8 rounded-2xl shadow-lg w-full max-w-md text-white">
    <h1 class="text-3xl font-bold mb-6 text-center">Login</h1>
    <form class="space-y-4">
      <input type="email" placeholder="Email" class="w-full px-4 py-3 rounded-lg bg-white/30 placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
      <input type="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg bg-white/30 placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
      
      <button type="submit" class="w-full py-3 bg-pink-500 hover:bg-pink-600 rounded-lg font-semibold">Login</button>
    </form>
    <p class="mt-4 text-center text-sm">Don’t have an account? 
      <a href="register.html" class="text-yellow-300 hover:underline">Register</a>
    </p>
  </div>

</body>
</html>
